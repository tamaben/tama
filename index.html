<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ヤッホー！おととかたちの ちいくあそび</title>

  <!-- PWA / iOS / Android メタタグ -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#050608" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ヤッホー知育" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      font-family: "Hiragino Maru Gothic ProN", "UD Digi Kyokasho N-R", "Yu Gothic", system-ui, -apple-system, sans-serif;
    }

    /* 有機EL(OLED)最適化：目にやさしい真黒〜濃紺ベース */
    body {
      background-color: #050608;
      background-image: radial-gradient(circle at 50% 44%, #0b0f17 0%, #050608 72%, #000000 100%);
      position: relative;
      cursor: pointer;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* シンプルでおしゃれな半透明ダークUI */
    .top-bar {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: calc(14px + env(safe-area-inset-left));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .pill-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    .icon-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(18, 22, 30, 0.76);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.18s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .icon-btn.active {
      background: rgba(34, 42, 56, 0.88);
      border-color: rgba(242, 220, 166, 0.34);
      color: #f2dca6;
    }

    .btn-install {
      background: rgba(242, 220, 166, 0.14);
      border-color: rgba(242, 220, 166, 0.35);
      color: #f2dca6;
      display: none;
    }

    /* チャイルドロック（1.5秒長押し解除） */
    .lock-overlay {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 30;
      display: none;
    }

    .lock-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(14, 17, 23, 0.68);
      color: rgba(203, 213, 225, 0.65);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 13px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
    }

    .lock-progress {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: rgba(242, 220, 166, 0.26);
      pointer-events: none;
    }

    /* 知育ナビゲーションカード */
    .edu-prompt {
      position: fixed;
      top: calc(68px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      pointer-events: none;
      text-align: center;
      width: 90%;
      max-width: 440px;
    }

    .edu-card {
      display: inline-block;
      background: rgba(15, 19, 27, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 20px;
      color: #e2e8f0;
      font-size: clamp(15px, 3.6vw, 18px);
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* 初期ガイド */
    .hint {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      padding: 24px;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .hint.hidden {
      opacity: 0;
      transform: scale(0.95);
    }

    .shape-trio {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 22px;
      animation: floatGentle 4.2s ease-in-out infinite;
    }

    .badge-shape {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .hint-title {
      color: #e2e8f0;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 800;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .hint-sub {
      color: #8492a6;
      font-size: clamp(13px, 2.8vw, 15px);
      font-weight: 600;
      line-height: 1.6;
    }

    /* 下部ステータス */
    .bottom-bar {
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: calc(16px + env(safe-area-inset-left));
      right: calc(16px + env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .badge {
      color: #8896ab;
      font-size: 12px;
      font-weight: 700;
      background: rgba(15, 19, 27, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    /* おやすみタイマー終了画面 */
    .sleep-curtain {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(3, 4, 6, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    .sleep-curtain.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .sleep-moon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e8d8a8, #bfa76a);
      opacity: 0.75;
      margin-bottom: 20px;
      position: relative;
    }

    .sleep-moon::before,
    .sleep-moon::after {
      content: "";
      position: absolute;
      top: 35px;
      width: 10px;
      height: 4px;
      border-bottom: 2px solid #1e222b;
      border-radius: 0 0 8px 8px;
    }
    .sleep-moon::before { left: 20px; }
    .sleep-moon::after { right: 20px; }

    .sleep-title {
      color: #cbd5e1;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .sleep-sub {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .parent-reset-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #64748b;
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
    }

    .warning-banner {
      position: fixed;
      bottom: calc(56px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      background: rgba(20, 24, 34, 0.94);
      border: 1px solid rgba(255, 229, 165, 0.3);
      color: #eef2f7;
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 90vw;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="fxCanvas"></canvas>

  <!-- シンプル操作バー -->
  <div class="top-bar" id="topBar">
    <div class="pill-group">
      <button class="icon-btn active" id="eduModeBtn" type="button" title="ちいくモードをえらぶ">
        <span id="eduModeIcon">🎯</span>
        <span id="eduModeLabel">おほしさまタッチ</span>
      </button>
      <button class="icon-btn active" id="echoBtn" type="button">
        <span id="echoLabel">🏔️ やまびこ</span>
      </button>
    </div>

    <div class="pill-group">
      <button class="icon-btn btn-install" id="installBtn" type="button">📲 アプリ化</button>
      <button class="icon-btn active" id="limitBtn" type="button" title="やりすぎ防止タイマー">⏳ 3ふん</button>
      <button class="icon-btn" id="lockBtn" type="button" title="こどもロック">🔒 ロック</button>
    </div>
  </div>

  <!-- 知育ナビゲーションカード -->
  <div class="edu-prompt" id="eduPrompt">
    <div class="edu-card" id="eduCard">ひかる おほしさまを タップできるかな？</div>
  </div>

  <!-- チャイルドロック解除 -->
  <div class="lock-overlay" id="lockOverlay">
    <button class="lock-btn" id="unlockBtn" type="button">
      <div class="lock-progress" id="lockProgress"></div>
      <span style="position:relative;z-index:1;">🔒 ながおしで解除</span>
    </button>
  </div>

  <!-- 初期ガイド -->
  <div class="hint" id="hint">
    <div class="shape-trio">
      <svg class="badge-shape" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="18" fill="#f2dca6" />
      </svg>
      <svg class="badge-shape" viewBox="0 0 44 44">
        <polygon points="22,5 40,37 4,37" fill="#a8d5d8" />
      </svg>
      <svg class="badge-shape" viewBox="0 0 44 44">
        <rect x="6" y="6" width="32" height="32" rx="6" fill="#e8c5ce" />
      </svg>
    </div>
    <div class="hint-title">ゆっくり タップしよう</div>
    <div class="hint-sub">やさしい こえが おうえん してくれるよ</div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <div class="badge" id="rhythmBadge">🌿 ゆったりリズム</div>
    <div class="badge" id="timerBadge">おやすみまで 3:00</div>
  </div>

  <!-- 時間終了時のやさしいおやすみ画面 -->
  <div class="sleep-curtain" id="sleepCurtain">
    <div class="sleep-moon"></div>
    <div class="sleep-title">おほしさまも おやすみのじかん</div>
    <div class="sleep-sub">きょうは いっぱい まなんで あそんだね。<br>また あした ちょうせん しようね！</div>
    <button class="parent-reset-btn" id="parentResetBtn" type="button">おとな用：もういちどあそぶ（長押し）</button>
  </div>

  <div class="warning-banner" id="warningBanner"></div>

  <script>
    // =========================================================================
    // 4つの音声ファイル定義
    // =========================================================================
    const AUDIO_FILES = {
      yahho: "./Mくん-2026-11-22-16-27-ヤッホー。.mp3",
      tapPrompt: "./Mくん-2026-11-22-16-50-タップできるかなー？.mp3",
      sugoi: "./Mくん-2026-11-22-16-47-すごいね！。.mp3",
      mataChousen: "./Mくん-2026-11-22-16-50-またちょうせんしてね！。.mp3"
    };

    const canvas = document.getElementById("fxCanvas");
    const ctx = canvas.getContext("2d");

    const topBar = document.getElementById("topBar");
    const bottomBar = document.getElementById("bottomBar");
    const hintEl = document.getElementById("hint");
    const eduCard = document.getElementById("eduCard");
    const rhythmBadge = document.getElementById("rhythmBadge");
    const timerBadge = document.getElementById("timerBadge");
    const sleepCurtain = document.getElementById("sleepCurtain");
    const parentResetBtn = document.getElementById("parentResetBtn");
    const warningBanner = document.getElementById("warningBanner");

    const eduModeBtn = document.getElementById("eduModeBtn");
    const eduModeIcon = document.getElementById("eduModeIcon");
    const eduModeLabel = document.getElementById("eduModeLabel");
    const echoBtn = document.getElementById("echoBtn");
    const echoLabel = document.getElementById("echoLabel");
    const limitBtn = document.getElementById("limitBtn");
    const lockBtn = document.getElementById("lockBtn");
    const lockOverlay = document.getElementById("lockOverlay");
    const unlockBtn = document.getElementById("unlockBtn");
    const lockProgress = document.getElementById("lockProgress");
    const installBtn = document.getElementById("installBtn");

    // PWA Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    // PWA Install prompt
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-flex";
    });
    installBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    // Canvas resize
    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // =========================================================================
    // 知育モード定義（4モード）
    // 1. おほしさまタッチ（目と手の協応トレーニング）：
    //    ターゲットが出現し「タップできるかなー？」→ 触れると「すごいね！」「ヤッホー！」
    //    外した時やしばらく待った時に「またちょうせんしてね！」
    // 2. いろ・かたち：まる・さんかく・しかく・ほし・はーと（5つ揃うと「すごいね！」）
    // 3. 1・2・3 かず：1〜5まで順番に数える（5まで数えると「すごいね！」）
    // 4. おとの たかさ：上・まんなか・下で声の高さと山の高さを体感
    // =========================================================================
    const eduModes = [
      {
        id: "target",
        icon: "🎯",
        label: "おほしさまタッチ",
        guide: "ひかる かたちを タップできるかなー？"
      },
      {
        id: "shapes",
        icon: "🔷",
        label: "いろ・かたち",
        guide: "タップすると いろ と かたち が でるよ"
      },
      {
        id: "numbers",
        icon: "🔢",
        label: "1・2・3 かず",
        guide: "1 から 5 まで かず を かぞえよう"
      },
      {
        id: "pitch",
        icon: "🎼",
        label: "おとの たかさ",
        guide: "うえは たかい声・したは ひくい声 だよ"
      }
    ];
    let eduModeIndex = 0;

    let shapeStep = 0;
    let numberStep = 0;
    let targetState = null; // { x, y, r, kind, color, name, pulse, spawnedAt, prompted }

    function createNextTarget() {
      const marginX = Math.max(76, window.innerWidth * 0.18);
      const marginTop = Math.max(150, window.innerHeight * 0.24);
      const marginBottom = Math.max(110, window.innerHeight * 0.18);
      const tx = marginX + Math.random() * Math.max(40, window.innerWidth - marginX * 2);
      const ty = marginTop + Math.random() * Math.max(40, window.innerHeight - marginTop - marginBottom);
      const item = shapeCatalog[shapeStep % shapeCatalog.length];
      shapeStep++;
      targetState = {
        x: tx,
        y: ty,
        r: 44, // 小さな子どもでも押しやすい大きめサイズ
        kind: item.kind,
        color: item.color,
        name: item.shapeName,
        colorName: item.colorName,
        pulse: 0,
        spawnedAt: performance.now(),
        reminded: false
      };
      eduCard.textContent = `${item.colorName}の「${item.name}」を タップできるかなー？`;
    }

    eduModeBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      eduModeIndex = (eduModeIndex + 1) % eduModes.length;
      const m = eduModes[eduModeIndex];
      eduModeIcon.textContent = m.icon;
      eduModeLabel.textContent = m.label;
      eduCard.textContent = m.guide;
      shapeStep = 0;
      numberStep = 0;
      targetState = null;

      if (m.id === "target" && !isSleeping) {
        createNextTarget();
        await initAudio();
        playClip("tapPrompt", 1.0, false);
      }
    });

    let echoEnabled = true;
    echoBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      echoEnabled = !echoEnabled;
      echoBtn.classList.toggle("active", echoEnabled);
      echoLabel.textContent = echoEnabled ? "🏔️ やまびこ" : "🔈 そのまま";
    });

    // やりすぎ防止タイマー（3分 / 5分 / 制限なし）
    const limitOptions = [
      { minutes: 3, label: "⏳ 3ふん" },
      { minutes: 5, label: "⏳ 5ふん" },
      { minutes: 0, label: "⏳ じゆう" }
    ];
    let limitIndex = 0;
    let sessionStartTime = null;
    let fadeProgress = 0;
    let isSleeping = false;

    limitBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      limitIndex = (limitIndex + 1) % limitOptions.length;
      limitBtn.textContent = limitOptions[limitIndex].label;
      limitBtn.classList.toggle("active", limitOptions[limitIndex].minutes > 0);
      sessionStartTime = null;
      fadeProgress = 0;
      updateTimerDisplay();
    });

    function updateTimerDisplay() {
      const mins = limitOptions[limitIndex].minutes;
      if (mins === 0) {
        timerBadge.textContent = "ゆったりちいくモード";
        return;
      }
      if (!sessionStartTime) {
        timerBadge.textContent = `おやすみまで ${mins}:00`;
        return;
      }
      const totalSec = mins * 60;
      const elapsedSec = Math.floor((performance.now() - sessionStartTime) / 1000);
      const remain = Math.max(0, totalSec - elapsedSec);
      const m = Math.floor(remain / 60);
      const s = String(remain % 60).padStart(2, "0");
      timerBadge.textContent = `おやすみまで ${m}:${s}`;

      if (remain <= 30 && remain > 0) {
        fadeProgress = (30 - remain) / 30;
        rhythmBadge.textContent = "🌙 もうすぐ おやすみ…";
      } else if (remain === 0 && !isSleeping) {
        fadeProgress = 1;
        isSleeping = true;
        sleepCurtain.classList.add("visible");
        // おやすみ移行時にやさしく「またちょうせんしてね！」を再生
        playClip("mataChousen", 1.0, false);
      }
    }
    setInterval(updateTimerDisplay, 500);

    // 保護者用リセット（1.5秒長押し）
    let resetTimer = null;
    parentResetBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      parentResetBtn.textContent = "そのまま おしつづけてね…";
      resetTimer = setTimeout(() => {
        isSleeping = false;
        sessionStartTime = null;
        fadeProgress = 0;
        sleepCurtain.classList.remove("visible");
        rhythmBadge.textContent = "🌿 ゆったりリズム";
        parentResetBtn.textContent = "おとな用：もういちどあそぶ（長押し）";
        updateTimerDisplay();
        if (eduModes[eduModeIndex].id === "target") {
          createNextTarget();
        }
      }, 1500);
    });
    const cancelReset = () => {
      if (resetTimer) clearTimeout(resetTimer);
      parentResetBtn.textContent = "おとな用：もういちどあそぶ（長押し）";
    };
    parentResetBtn.addEventListener("pointerup", cancelReset);
    parentResetBtn.addEventListener("pointerleave", cancelReset);

    // チャイルドロック（1.5秒長押し解除）
    let isLocked = false;
    lockBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      isLocked = true;
      topBar.style.display = "none";
      bottomBar.style.display = "none";
      lockOverlay.style.display = "block";
    });

    let unlockTimer = null;
    let unlockStart = 0;
    const UNLOCK_DURATION = 1500;

    function startUnlock(e) {
      e.stopPropagation();
      unlockStart = performance.now();
      unlockTimer = requestAnimationFrame(updateUnlockProgress);
    }

    function updateUnlockProgress(now) {
      const elapsed = now - unlockStart;
      const pct = Math.min(100, (elapsed / UNLOCK_DURATION) * 100);
      lockProgress.style.width = pct + "%";
      if (pct >= 100) {
        isLocked = false;
        topBar.style.display = "flex";
        bottomBar.style.display = "flex";
        lockOverlay.style.display = "none";
        lockProgress.style.width = "0%";
        unlockTimer = null;
      } else {
        unlockTimer = requestAnimationFrame(updateUnlockProgress);
      }
    }

    function cancelUnlock(e) {
      if (e) e.stopPropagation();
      if (unlockTimer) {
        cancelAnimationFrame(unlockTimer);
        unlockTimer = null;
      }
      lockProgress.style.width = "0%";
    }

    unlockBtn.addEventListener("pointerdown", startUnlock);
    unlockBtn.addEventListener("pointerup", cancelUnlock);
    unlockBtn.addEventListener("pointerleave", cancelUnlock);
    unlockBtn.addEventListener("pointercancel", cancelUnlock);

    // =========================================================================
    // Web Audio API（4音声プリロード＆やまびこ処理）
    // =========================================================================
    let audioCtx = null;
    const audioBuffers = {};
    let masterGain = null;
    let delayNode = null;
    let feedbackGain = null;
    let wetGain = null;
    let useHtmlAudioFallback = false;

    async function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.88;

        const softFilter = audioCtx.createBiquadFilter();
        softFilter.type = "lowpass";
        softFilter.frequency.value = 4600;

        delayNode = audioCtx.createDelay(2.0);
        delayNode.delayTime.value = 0.32;

        const echoFilter = audioCtx.createBiquadFilter();
        echoFilter.type = "lowpass";
        echoFilter.frequency.value = 1850;

        feedbackGain = audioCtx.createGain();
        feedbackGain.gain.value = 0.35;

        wetGain = audioCtx.createGain();
        wetGain.gain.value = echoEnabled ? 0.46 : 0.0;

        softFilter.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        delayNode.connect(echoFilter);
        echoFilter.connect(feedbackGain);
        feedbackGain.connect(delayNode);
        echoFilter.connect(wetGain);
        wetGain.connect(masterGain);

        window._softFilter = softFilter;
      }

      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      if (!useHtmlAudioFallback) {
        const entries = Object.entries(AUDIO_FILES);
        await Promise.all(
          entries.map(async ([key, url]) => {
            if (audioBuffers[key]) return;
            try {
              const res = await fetch(url);
              if (!res.ok) throw new Error("Fetch failed");
              const arrayBuf = await res.arrayBuffer();
              audioBuffers[key] = await audioCtx.decodeAudioData(arrayBuf);
            } catch (err) {
              useHtmlAudioFallback = true;
            }
          })
        );
      }
    }

    function playClip(key, rate = 1.0, applyEcho = true) {
      const targetVol = Math.max(0.18, 0.88 * (1 - fadeProgress * 0.72));
      const useEchoNow = applyEcho && echoEnabled;

      if (audioBuffers[key] && audioCtx) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        masterGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.02);
        wetGain.gain.setTargetAtTime(useEchoNow ? 0.46 : 0.0, audioCtx.currentTime, 0.015);

        const src = audioCtx.createBufferSource();
        src.buffer = audioBuffers[key];
        src.playbackRate.value = rate;
        src.connect(window._softFilter);
        if (useEchoNow) {
          src.connect(delayNode);
        }
        src.start(0);
      } else {
        const url = AUDIO_FILES[key];
        if (!url) return;
        const a = new Audio(url);
        a.volume = targetVol;
        a.playbackRate = rate;
        a.play().catch(() => {
          warningBanner.style.display = "block";
          warningBanner.textContent = "ZIP内の音声ファイル（MP3）を index.html と同じフォルダに置いて開いてください。";
        });

        if (useEchoNow) {
          setTimeout(() => {
            const e1 = new Audio(url);
            e1.volume = targetVol * 0.36;
            e1.playbackRate = rate;
            e1.play().catch(() => {});
          }, 300);
        }
      }
    }

    // =========================================================================
    // 知育ビジュアルデータ（色・形・数・音の高さ）
    // =========================================================================
    const shapeCatalog = [
      { kind: "circle",   shapeName: "まる",     colorName: "きいろ",   color: "#f2dca6" },
      { kind: "triangle", shapeName: "さんかく", colorName: "みずいろ", color: "#a8d5d8" },
      { kind: "square",   shapeName: "しかく",   colorName: "ももいろ", color: "#e8c5ce" },
      { kind: "star",     shapeName: "ほし",     colorName: "みどり",   color: "#b5d8c3" },
      { kind: "heart",    shapeName: "はーと",   colorName: "むらさき", color: "#c5b8d9" }
    ];

    const numberCatalog = [
      { num: 1, reading: "いち", color: "#f2dca6" },
      { num: 2, reading: "に",   color: "#a8d5d8" },
      { num: 3, reading: "さん", color: "#e8c5ce" },
      { num: 4, reading: "し",   color: "#b5d8c3" },
      { num: 5, reading: "ご",   color: "#c5b8d9" }
    ];

    const bgStars = Array.from({ length: 22 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 0.8 + Math.random() * 1.0,
      phase: Math.random() * Math.PI * 2,
      speed: 0.008 + Math.random() * 0.009
    }));

    const ripples = [];
    const eduItems = [];
    const breathDots = [];

    function spawnRestBreath(x, y) {
      if (breathDots.length > 4) return;
      breathDots.push({ x, y, radius: 6, alpha: 0.3 });
    }

    function drawStar(cx, cy, spikes, outerR, innerR) {
      let rot = (Math.PI / 2) * 3;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerR);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
        rot += step;
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawHeart(cx, cy, size) {
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(cx, cy + topCurveHeight);
      ctx.bezierCurveTo(cx, cy, cx - size, cy, cx - size, cy + topCurveHeight);
      ctx.bezierCurveTo(cx - size, cy + (size + topCurveHeight) / 2, cx, cy + (size + topCurveHeight) / 1.3, cx, cy + size);
      ctx.bezierCurveTo(cx, cy + (size + topCurveHeight) / 1.3, cx + size, cy + (size + topCurveHeight) / 2, cx + size, cy + topCurveHeight);
      ctx.bezierCurveTo(cx + size, cy, cx, cy, cx, cy + topCurveHeight);
      ctx.closePath();
      ctx.fill();
    }

    function drawShapeByKind(kind, yOffset = -6, scaleFactor = 1.0) {
      ctx.save();
      ctx.scale(scaleFactor, scaleFactor);
      if (kind === "circle") {
        ctx.beginPath();
        ctx.arc(0, yOffset, 26, 0, Math.PI * 2);
        ctx.fill();
      } else if (kind === "triangle") {
        ctx.beginPath();
        ctx.moveTo(0, yOffset - 26);
        ctx.lineTo(28, yOffset + 24);
        ctx.lineTo(-28, yOffset + 24);
        ctx.closePath();
        ctx.fill();
      } else if (kind === "square") {
        ctx.beginPath();
        ctx.roundRect(-24, yOffset - 24, 48, 48, 8);
        ctx.fill();
      } else if (kind === "star") {
        drawStar(0, yOffset, 5, 29, 14);
      } else if (kind === "heart") {
        drawHeart(0, yOffset - 18, 24);
      }
      ctx.restore();
    }

    function drawTarget() {
      if (!targetState || isSleeping || eduModes[eduModeIndex].id !== "target") return;
      targetState.pulse += 0.045;
      const breath = 1.0 + Math.sin(targetState.pulse) * 0.06;
      const alphaScale = Math.max(0.25, 0.9 * (1 - fadeProgress * 0.65));

      ctx.save();
      ctx.translate(targetState.x, targetState.y);

      // ゆっくり呼吸する外周ガイドリング
      ctx.beginPath();
      ctx.arc(0, 0, targetState.r * (1.12 + Math.sin(targetState.pulse) * 0.08), 0, Math.PI * 2);
      ctx.strokeStyle = targetState.color;
      ctx.globalAlpha = 0.35 * alphaScale;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.setLineDash([]);

      // 本体図形
      ctx.scale(breath, breath);
      ctx.globalAlpha = alphaScale;
      ctx.shadowColor = targetState.color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = targetState.color;
      drawShapeByKind(targetState.kind, 0, 1.08);

      // おめめ
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#1c2029";
      ctx.beginPath();
      ctx.arc(-6, 0, 2.3, 0, Math.PI * 2);
      ctx.arc(6, 0, 2.3, 0, Math.PI * 2);
      ctx.fill();

      // ラベル
      ctx.font = '800 16px "Hiragino Maru Gothic ProN", "UD Digi Kyokasho N-R", sans-serif';
      ctx.textAlign = "center";
      ctx.fillStyle = "#e2e8f0";
      ctx.fillText("ここだよ", 0, 48);

      ctx.restore();
    }

    function drawEduItem(obj) {
      ctx.save();
      ctx.translate(obj.x, obj.y);
      ctx.scale(obj.scale, obj.scale);
      ctx.globalAlpha = Math.max(0, obj.alpha);

      if (obj.mode === "shapes" || obj.mode === "targetSuccess") {
        const it = obj.item;
        ctx.shadowColor = it.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = it.color;
        drawShapeByKind(it.kind, -6, 1.0);

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#1c2029";
        ctx.beginPath();
        ctx.arc(-6, -6, 2.2, 0, Math.PI * 2);
        ctx.arc(6, -6, 2.2, 0, Math.PI * 2);
        ctx.fill();

        const caption = obj.mode === "targetSuccess" ? `すごいね！ ${it.shapeName}` : it.shapeName;
        ctx.font = '800 18px "Hiragino Maru Gothic ProN", "UD Digi Kyokasho N-R", sans-serif';
        ctx.textAlign = "center";
        ctx.fillStyle = "#e2e8f0";
        ctx.fillText(caption, 0, 42);

      } else if (obj.mode === "numbers") {
        const it = obj.item;
        ctx.fillStyle = it.color;
        ctx.shadowColor = it.color;
        ctx.shadowBlur = 10;

        const spacing = 22;
        const startX = -((it.num - 1) * spacing) / 2;
        for (let i = 0; i < it.num; i++) {
          ctx.beginPath();
          ctx.arc(startX + i * spacing, -26, 7.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.shadowBlur = 0;
        ctx.font = '900 34px "Hiragino Maru Gothic ProN", "UD Digi Kyokasho N-R", sans-serif';
        ctx.textAlign = "center";
        ctx.fillStyle = it.color;
        ctx.fillText(String(it.num), 0, 16);

        ctx.font = '800 16px "Hiragino Maru Gothic ProN", "UD Digi Kyokasho N-R", sans-serif';
        ctx.fillStyle = "#cbd5e1";
        ctx.fillText(it.reading, 0, 38);

      } else {
        ctx.fillStyle = obj.color;
        ctx.shadowColor = obj.color;
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(-36, 18);
        ctx.lineTo(0, -28);
        ctx.lineTo(36, 18);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#050608";
        const markerY = obj.level === "high" ? -14 : obj.level === "mid" ? 0 : 11;
        ctx.beginPath();
        ctx.arc(0, markerY, 4.5, 0, Math.PI * 2);
        ctx.fill();

        const labelText = obj.level === "high" ? "たかい！" : obj.level === "mid" ? "ふつう" : "ひくい！";
        ctx.font = '800 18px "Hiragino Maru Gothic ProN", "UD Digi Kyokasho N-R", sans-serif';
        ctx.textAlign = "center";
        ctx.fillStyle = "#e2e8f0";
        ctx.fillText(labelText, 0, 40);
      }

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      if (eduModes[eduModeIndex].id === "pitch" && !isSleeping) {
        ctx.save();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.setLineDash([6, 6]);
        ctx.lineWidth = 1;
        [0.36, 0.68].forEach((ratio) => {
          const ly = window.innerHeight * ratio;
          ctx.beginPath();
          ctx.moveTo(24, ly);
          ctx.lineTo(window.innerWidth - 24, ly);
          ctx.stroke();
        });
        ctx.restore();
      }

      const starAlpha = 0.32 * (1 - fadeProgress * 0.7);
      for (const s of bgStars) {
        s.phase += s.speed;
        const a = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(s.phase))) * starAlpha;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (let i = breathDots.length - 1; i >= 0; i--) {
        const d = breathDots[i];
        d.radius += 0.6;
        d.alpha -= 0.008;
        if (d.alpha <= 0) {
          breathDots.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(203, 213, 225, 0.45)";
        ctx.globalAlpha = d.alpha;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }

      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.radius += r.speed;
        r.speed *= 0.988;
        r.alpha -= 0.0065;
        if (r.alpha <= 0 || r.radius >= r.maxRadius) {
          ripples.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.strokeStyle = r.color;
        ctx.globalAlpha = Math.max(0, r.alpha);
        ctx.lineWidth = r.lineWidth;
        ctx.stroke();
        ctx.restore();
      }

      drawTarget();

      for (let i = eduItems.length - 1; i >= 0; i--) {
        const obj = eduItems[i];
        obj.y += obj.vy;
        obj.vy *= 0.985;
        obj.scale += (obj.targetScale - obj.scale) * 0.12;
        obj.alpha -= 0.0048;
        if (obj.alpha <= 0) {
          eduItems.splice(i, 1);
          continue;
        }
        drawEduItem(obj);
      }

      requestAnimationFrame(animate);
    }
    animate();

    // 初期ターゲットを準備
    createNextTarget();

    // 連打防止クールダウン制御
    let lastTriggerTime = 0;
    const COOLDOWN_MS = 900;
    let hasInteracted = false;

    async function handleTap(x, y) {
      if (isSleeping) return;

      const now = performance.now();
      if (now - lastTriggerTime < COOLDOWN_MS) {
        spawnRestBreath(x, y);
        return;
      }

      lastTriggerTime = now;

      if (!hasInteracted) {
        hasInteracted = true;
        hintEl.classList.add("hidden");
        sessionStartTime = now;
        updateTimerDisplay();
      }

      await initAudio();
      const mode = eduModes[eduModeIndex].id;
      const alphaScale = Math.max(0.25, 0.88 * (1 - fadeProgress * 0.65));

      if (eduItems.length >= 2) {
        eduItems.shift();
      }

      // 1. おほしさまタッチモード（ターゲット接触判定＋4音声の掛け合い）
      if (mode === "target") {
        if (!targetState) createNextTarget();
        const dist = Math.hypot(x - targetState.x, y - targetState.y);
        const hitRadius = targetState.r * 1.45; // 幼児にやさしい広めの当たり判定

        if (dist <= hitRadius) {
          // 成功！「すごいね！」＋「ヤッホー！」
          const hitItem = {
            kind: targetState.kind,
            shapeName: targetState.name,
            colorName: targetState.colorName,
            color: targetState.color
          };
          eduCard.textContent = `すごいね！ 「${hitItem.shapeName}」に タッチできたよ！`;

          ripples.push({
            x: targetState.x, y: targetState.y, radius: 18, maxRadius: 165,
            alpha: 0.65 * alphaScale, lineWidth: 2.8, speed: 1.9, color: hitItem.color
          });

          eduItems.push({
            mode: "targetSuccess",
            x: targetState.x, y: targetState.y,
            vy: -0.45, scale: 0.5, targetScale: 1.05, alpha: alphaScale,
            item: hitItem
          });

          targetState = null;
          playClip("sugoi", 1.0, false);
          setTimeout(() => {
            if (!isSleeping) playClip("yahho", 1.0, true);
          }, 680);

          // 次のターゲットを出して「タップできるかなー？」
          setTimeout(() => {
            if (!isSleeping && eduModes[eduModeIndex].id === "target") {
              createNextTarget();
              playClip("tapPrompt", 1.0, false);
            }
          }, 1950);

        } else {
          // ターゲットの外をタップしたとき：優しく励ます「またちょうせんしてね！」
          eduCard.textContent = `おしい！ 「${targetState.name}」の ところを タップしてみよう`;
          spawnRestBreath(x, y);
          playClip("mataChousen", 1.0, false);
        }

      // 2. いろ・かたちモード（5種類1周ごとに「すごいね！」）
      } else if (mode === "shapes") {
        const item = shapeCatalog[shapeStep % shapeCatalog.length];
        shapeStep++;
        const isMilestone = shapeStep % shapeCatalog.length === 0;
        eduCard.textContent = isMilestone
          ? `すごいね！ 5つの かたちが そろったよ`
          : `${item.colorName} の 「${item.shapeName}」`;

        ripples.push({
          x, y, radius: 16, maxRadius: 150, alpha: 0.6 * alphaScale,
          lineWidth: 2.5, speed: 1.8, color: item.color
        });

        eduItems.push({
          mode: "shapes",
          x, y, vy: -0.45, scale: 0.45, targetScale: 1.0, alpha: alphaScale,
          item
        });

        playClip("yahho", 1.0, true);
        if (isMilestone) {
          setTimeout(() => {
            if (!isSleeping) playClip("sugoi", 1.0, false);
          }, 750);
        }

      // 3. 1・2・3 かずモード（5まで数えると「すごいね！」）
      } else if (mode === "numbers") {
        const item = numberCatalog[numberStep % numberCatalog.length];
        numberStep++;
        const isFive = item.num === 5;
        eduCard.textContent = isFive
          ? `すごいね！ 「5 （ご）」まで かぞえられたよ`
          : `かず： 「${item.num} （${item.reading}）」`;

        ripples.push({
          x, y, radius: 16, maxRadius: 150, alpha: 0.6 * alphaScale,
          lineWidth: 2.5, speed: 1.8, color: item.color
        });

        eduItems.push({
          mode: "numbers",
          x, y, vy: -0.45, scale: 0.45, targetScale: 1.0, alpha: alphaScale,
          item
        });

        const pentatonicRates = [1.0, 1.122, 1.26, 1.335, 1.498];
        playClip("yahho", pentatonicRates[item.num - 1], true);
        if (isFive) {
          setTimeout(() => {
            if (!isSleeping) playClip("sugoi", 1.0, false);
          }, 750);
        }

      // 4. おとの たかさモード
      } else {
        const ratio = y / window.innerHeight;
        let level, rate, color, label;
        if (ratio < 0.36) {
          level = "high";
          rate = 1.28;
          color = "#f2dca6";
          label = "おやまの うえ： 「たかい 声」";
        } else if (ratio < 0.68) {
          level = "mid";
          rate = 1.0;
          color = "#a8d5d8";
          label = "おやまの まんなか： 「ふつうの 声」";
        } else {
          level = "low";
          rate = 0.8;
          color = "#c5b8d9";
          label = "おやまの ふもと： 「ひくい 声」";
        }
        eduCard.textContent = label;

        ripples.push({
          x, y, radius: 16, maxRadius: 150, alpha: 0.6 * alphaScale,
          lineWidth: 2.5, speed: 1.8, color
        });

        eduItems.push({
          mode: "pitch",
          x, y, vy: -0.45, scale: 0.45, targetScale: 1.0, alpha: alphaScale,
          level, color
        });

        playClip("yahho", rate, true);
      }

      rhythmBadge.textContent = "🏔️ やまびこ まち…";
      setTimeout(() => {
        if (!isSleeping && fadeProgress === 0) {
          rhythmBadge.textContent = "🌿 ゆったりリズム";
        }
      }, COOLDOWN_MS);
    }

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest("#topBar") || e.target.closest("#lockOverlay") || e.target.closest("#sleepCurtain")) return;
      handleTap(e.clientX, e.clientY);
    });

    window.addEventListener("DOMContentLoaded", () => {
      initAudio().catch(() => {});
    });
  </script>
</body>
</html>
